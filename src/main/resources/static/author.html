<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authors</title>
    <link rel="stylesheet" href="author.css">
</head>
<body>
<h2>Author Management Portal</h2>

<!-- Form to Add Author -->
<form id="authorForm">
    <h3>Add New Author</h3>
    <input type="text" id="u_name" placeholder="Username (u_name)" required><br>
    <input type="text" id="f_name" placeholder="First Name"><br>
    <input type="text" id="l_name" placeholder="Last Name"><br>
    <input type="password" id="p_word" placeholder="Password"><br>
    <button type="submit">Save Author</button>
</form>

<!-- Table to Display Authors -->
<h3>Authors List</h3>
<table>
    <thead>
    <tr>
        <th>Username</th>
        <th>First Name</th>
        <th>Last Name</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody id="authorTableBody">
    <!-- Data will be populated here via JavaScript -->
    </tbody>
</table>
<script src="author.js"></script>
</body>
</html>
